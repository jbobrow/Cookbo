<!DOCTYPE html>
<html lang="en">
<head>
<!-- Source for the site's share video (og:video): the share image, with the
     site's produce dropping in beside the name, rocking, one hopping, then
     fading away so the loop closes on the same frame it opens on.
     The produce drawings and the drop, rock and hop motion are copied from
     docs/index.html. Open it in a browser to watch it loop; re-render the
     video with ./render-video.sh -->
<meta charset="utf-8">
<title>Cookbo share video</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=block">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F4F3F1;
    color: #16171B;
    font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .copy {
    position: absolute; left: 88px; top: 0; bottom: 0; width: 540px;
    display: flex; flex-direction: column; justify-content: center; gap: 26px;
  }
  .app { display: flex; align-items: center; gap: 22px; }
  .app img { width: 84px; height: 84px; border-radius: 19px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 6px 18px rgba(0,0,0,.10); }
  .app span { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  h1 {
    font-family: ui-rounded, "SF Pro Rounded", Nunito, system-ui, -apple-system, sans-serif;
    font-size: 68px; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .pitch { font-size: 25px; line-height: 1.38; color: #5d5e64; font-weight: 500; max-width: 500px; }
  .note { font-size: 19px; font-weight: 600; color: #5d5e64; opacity: .8; margin-top: -12px; }
  /* Produce, standing on the name's baseline (Nunito's descent is .353em of 40px) */
  .app > span { position: relative; }
  .app .produce {
    position: absolute; left: calc(100% + 22px); bottom: 14px;
    display: flex; align-items: flex-end;
    font-size: 56px; letter-spacing: 0;
  }
  .app .produce .item { display: block; width: auto; overflow: visible; transform-origin: 50% 100%; opacity: 0; }
  .produce .item + .item { margin-left: .06em; }
  .lemon { height: .62em; }
  .carrot { height: .6em; }
  .tomato { height: .84em; }
  .broccoli { height: .9em; }

  .sig { width: 214px; height: auto; color: #16171B; margin-top: 6px; }

  /* iPhone, cropped by the bottom edge like the NYC Parking preview */
  .phone {
    position: absolute; left: 690px; top: 52px; width: 418px; height: 900px;
    border-radius: 72px; padding: 14px;
    background: #1c1c1e;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 0 0 1.5px rgba(0,0,0,.35), 0 30px 60px rgba(0,0,0,.18);
  }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 58px; overflow: hidden; background: #000; }
  .screen img { width: 100%; display: block; }
  .island { position: absolute; top: 14px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 17px; background: #000; }

  /* Mac: the two screens bleed off the right edge */
  .mac { position: absolute; left: 620px; top: 96px; width: 640px; }
  .macs { width: 100%; display: block; filter: drop-shadow(0 24px 40px rgba(0,0,0,.12)); }
  .cur { position: absolute; width: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .c1 { left: 170px; top: 170px; }
  .c2 { left: 470px; top: 120px; }
</style>
</head>
<body>
  <div class="copy">

      <svg class="item lemon" viewBox="0 0 64 44" style="--spin:-28deg;--rest:-7deg"><path d="M4 24c2-3 4-4 6-5 3-8 12-12 22-12s19 4 22 12c2 1 4 2 6 5-2 3-4 4-6 5-3 8-12 12-22 12S13 37 10 29c-2-1-4-2-6-5Z" fill="#FFD43B"/><path d="M17 17c4-4 10-5 15-5" fill="none" stroke="#FFF3B0" stroke-width="3.5" stroke-linecap="round"/><path d="M46 33c-4 3-9 4-14 4" fill="none" stroke="#E9B324" stroke-width="3" stroke-linecap="round"/><path d="M4 24c2-3 4-4 6-5 3-8 12-12 22-12s19 4 22 12c2 1 4 2 6 5-2 3-4 4-6 5-3 8-12 12-22 12S13 37 10 29c-2-1-4-2-6-5Z" fill="none" stroke="#2A1B24" stroke-width="4" stroke-linejoin="round"/><path d="M44 9c3-6 9-8 14-7-2 6-8 9-14 7Z" fill="#5E9E2E" stroke="#2A1B24" stroke-width="2.6" stroke-linejoin="round"/></svg>
      <svg class="item broccoli" viewBox="0 0 56 60" style="--spin:30deg;--rest:-3deg"><path d="M22 34l-2 22c0 3 16 3 16 0l-2-22Z" fill="#A9D371" stroke="#2A1B24" stroke-width="4" stroke-linejoin="round"/><path d="M28 40v14M33 40l-1 10" fill="none" stroke="#86B84F" stroke-width="2.4" stroke-linecap="round"/><path d="M12 34C4 34 3 23 10 20 9 11 19 6 25 11c4-7 16-7 18 2 8-1 13 8 9 14 5 6-2 14-9 11-4 6-14 6-17 1-5 4-14 2-14-5Z" fill="#4E9B34"/><g fill="#3B7F26"><circle cx="17" cy="27" r="3.2"/><circle cx="30" cy="22" r="3.6"/><circle cx="41" cy="27" r="3"/><circle cx="26" cy="33" r="2.6"/></g><g fill="#7FC255"><circle cx="19" cy="17" r="2.6"/><circle cx="35" cy="13" r="2.2"/><circle cx="46" cy="21" r="1.8"/></g><path d="M12 34C4 34 3 23 10 20 9 11 19 6 25 11c4-7 16-7 18 2 8-1 13 8 9 14 5 6-2 14-9 11-4 6-14 6-17 1-5 4-14 2-14-5Z" fill="none" stroke="#2A1B24" stroke-width="4" stroke-linejoin="round"/></svg>
      <svg class="item carrot" viewBox="0 0 96 40" style="--spin:32deg;--rest:5deg"><g stroke="#2A1B24" stroke-width="3" stroke-linejoin="round"><path d="M24 17C16 9 8 4 2 5c1 7 10 11 20 15Z" fill="#6BAA35"/><path d="M23 21C13 20 6 17 2 21c5 5 13 5 21 3Z" fill="#5A9A2B"/><path d="M24 25C17 30 12 35 9 38c6 1 12-4 17-10Z" fill="#6BAA35"/></g><path d="M24 11c14-2 40 4 66 16 3 2 3 5 0 6-26 6-52 6-66 3-9-2-10-23 0-25Z" fill="#F37F1F"/><path d="M30 16c12-1 24 1 34 5" fill="none" stroke="#FFB27A" stroke-width="3" stroke-linecap="round"/><path d="M42 29l3-5M57 30l3-6M71 30l2-4M36 13l1 4" fill="none" stroke="#C85A0E" stroke-width="2.4" stroke-linecap="round"/><path d="M24 11c14-2 40 4 66 16 3 2 3 5 0 6-26 6-52 6-66 3-9-2-10-23 0-25Z" fill="none" stroke="#2A1B24" stroke-width="4" stroke-linejoin="round"/></svg>
    </span></span></div>
    <h1>Every recipe you cook, in one place.</h1>
    <p class="pitch">Share any recipe to Cookbo. It keeps the recipe and leaves the rest.</p>
    
    <!-- The same signature as the site footers and the other previews -->
    <svg class="sig" aria-label="App by Jon Bobrow" viewBox="0 0 3087.29 681.93" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"><path d="M1610.11,335.11c0,17.82,19.8,77.22,3.96,110.89M15,537.47C23.66,136.35,107.34,18.04,136.2,15.15c28.86-2.89,86.57,31.74,86.57,484.8M80.58,356.55c65.34-37.62,178.21-25.74,178.21-25.74M320.17,330.81c81.18-15.84,176.23,73.26,47.52,142.57M466.7,328.83c81.18-15.84,160.39,71.28,67.32,134.65M353.83,396.15c-5.94,104.95,29.7,241.57,29.7,241.57M490.46,378.33c-5.94,104.95,13.86,211.87,13.86,211.87M788.37,148.98c-11.88,49.5-26.16,130.64-33.66,199.99-7.92,73.26,38.68,123.77,86.2,90.1s12.8-101.98-40.66-98.06M923.02,537.08c-35.64,27.72-53.4,109.67,2.96,126.69,69.81,21.08,80.2-67.28,76.24-138.57s-19.8-194.05-19.8-194.05M982.42,331.15c1.98,75.24-9.9,118.81-51.48,110.89s-31.68-85.14-23.76-128.71M1388.34,55.92c29.7,142.57,55.95,373.41-47.52,407.9-71.28,23.76-100.98-51.48-93.06-83.16M1507.15,321.25c-45.54-3.96-56.51,138.61,9.9,138.61,73.26,0,47.85-133.59-9.9-138.61ZM2225.92,343.03c-72.62,9.68-56.39,142.67,9.9,138.61,97.02-5.94,49.5-146.53-9.9-138.61ZM2686.12,343.13c-64.18-8.02-87.35,95.19-26.56,112.77,66.28,19.16,73.26-106.93,26.56-112.77ZM1614.07,445.99c19.8-85.14,41.58-116.83,55.44-116.83s37.62,108.91,73.26,128.71M1934.85,172.74c47.52-45.54,186.13-25.74,194.05,33.66,7.92,59.4-39.6,97.02-37.62,122.77s56.36,69.3,38.54,120.79-66.26,57.42-137.55,25.74M2002.17,198.48c-5.94,47.52-1.98,209.89,7.92,241.57M2352.65,182.64c-7.92,55.44-9.84,280.18,67.32,277.21,51.48-1.98,57.42-116.83-17.82-122.77M2590.26,305.41c-35.64,13.86-59.4,27.56-59.4,134.65,0,9.9-15.84-93.06-19.8-116.83M2881.33,392.53s-9.9,67.32,39.6,65.34c69.28-2.77,130.89-59.33,148.51-138.61,15.84-71.28-39.6-83.16-39.6-83.16M2778.37,360.85c-7.92,49.5-1.85,92.77,17.82,95.04,51.48,5.94,85.14-63.36,85.14-63.36"/></svg>
  </div>
  <div class="phone"><div class="screen"><img src="screen.webp" alt=""><div class="island"></div></div></div>

  <script>
  // One 8-second loop, as Web Animations so a browser plays it and the
  // recorder can step it frame by frame. Times are in seconds.
  (() => {
    const T = 8, EM = 56;
    const LONG = ['carrot', 'eggplant', 'peapod', 'corn'];
    const deg = (s) => parseFloat(s);
    const items = [...document.querySelectorAll('.produce .item')];

    // Each piece: the site's drop, then any rocks and hops, then a soft fade out
    const plan = [
      { drop: .25, rocks: [[2.9, 1, 1]], hops: [[4.55, -1, 1]], fade: 6.9 },
      { drop: .37, rocks: [[3.02, 1, 1], [5.12, 1, .5]], fade: 6.98 },
      { drop: .49, rocks: [[3.14, 1, 1]], fade: 7.06 },
      { drop: .61, rocks: [[3.26, 1, 1], [5.7, -1, .5]], fade: 7.14 },
    ];

    items.forEach((el, n) => {
      const spin = deg(el.style.getPropertyValue('--spin'));
      const r = deg(el.style.getPropertyValue('--rest'));
      const heavy = LONG.includes(el.classList[1]);
      const rest = `translateY(0px) rotate(${r}deg) scale(1, 1)`;
      const p = plan[n];
      const segs = [];

      // drop .95s (the site's keyframes)
      segs.push({ at: p.drop, dur: .95, kf: [
        { o: 0, opacity: 0, transform: `translateY(-260px) rotate(${spin}deg) scale(1, 1)`, easing: 'cubic-bezier(.5, 0, 1, .55)' },
        { o: .06, opacity: 1 },
        { o: .52, transform: `translateY(0px) rotate(${r * .5}deg) scale(1.1, .8)`, easing: 'cubic-bezier(.2, .7, .4, 1)' },
        { o: .68, transform: `translateY(-14%) rotate(${r * 1.4}deg) scale(.96, 1.05)`, easing: 'cubic-bezier(.5, 0, 1, .6)' },
        { o: .82, transform: `translateY(0px) rotate(${r}deg) scale(1.04, .95)`, easing: 'ease-out' },
        { o: 1, opacity: 1, transform: rest },
      ]});

      const rock = (at, push, swing) => {
        const s = swing * (heavy ? .75 : 1), e = 'cubic-bezier(.3, .6, .4, 1)';
        const a = (d) => `translateY(0px) rotate(${r + d * push * s}deg) scale(1, 1)`;
        segs.push({ at, dur: .8 * (heavy ? 1.2 : 1), kf: [
          { o: 0, transform: rest, easing: e }, { o: .18, transform: a(9), easing: e },
          { o: .38, transform: a(-7), easing: e }, { o: .58, transform: a(4), easing: e },
          { o: .78, transform: a(-1.5), easing: e }, { o: 1, transform: rest },
        ]});
      };
      // hop .8s (the site's keyframes), then the rock it always ends with
      const hop = (at, push, height) => {
        const h = height * (heavy ? .7 : 1);
        segs.push({ at, dur: .8, kf: [
          { o: 0, transform: rest, easing: 'cubic-bezier(.3, 0, .6, 1)' },
          { o: .12, transform: `translateY(0px) rotate(${r}deg) scale(1.1, .86)`, easing: 'cubic-bezier(.2, .7, .4, 1)' },
          { o: .42, transform: `translateY(${-.5 * EM * h}px) rotate(${r + 12 * push}deg) scale(.95, 1.07)`, easing: 'cubic-bezier(.5, 0, 1, .55)' },
          { o: .68, transform: `translateY(0px) rotate(${r + 4 * push}deg) scale(1.12, .82)`, easing: 'cubic-bezier(.2, .7, .4, 1)' },
          { o: .82, transform: `translateY(-12%) rotate(${r}deg) scale(.97, 1.04)`, easing: 'cubic-bezier(.5, 0, 1, .6)' },
          { o: .92, transform: `translateY(0px) rotate(${r}deg) scale(1.04, .96)` },
          { o: 1, transform: rest },
        ]});
        rock(at + .8, push, 1.3);
      };
      p.rocks.forEach((a) => rock(...a));
      (p.hops || []).forEach((a) => hop(...a));

      // fade away, sinking a touch
      segs.push({ at: p.fade, dur: .45, kf: [
        { o: 0, opacity: 1, transform: rest, easing: 'cubic-bezier(.4, 0, 1, 1)' },
        { o: 1, opacity: 0, transform: `translateY(6px) rotate(${r}deg) scale(.92, .92)` },
      ]});

      segs.sort((a, b) => a.at - b.at);
      const frames = [];
      for (const s of segs) for (const k of s.kf) {
        const { o, ...props } = k;
        frames.push({ offset: (s.at + o * s.dur) / T, ...props });
      }
      // Hold the opening pose from 0, and the faded pose to the end
      frames.unshift({ offset: 0, opacity: 0, transform: segs[0].kf[0].transform });
      frames.push({ offset: 1, opacity: 0, transform: segs.at(-1).kf.at(-1).transform });
      el.animate(frames, { duration: T * 1000, iterations: Infinity });
    });
  })();
  </script>
</body>

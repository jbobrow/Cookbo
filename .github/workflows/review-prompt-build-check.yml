name: Review prompt build check
on:
  push:
    branches: [review-prompt]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app || true; xcodebuild -version
      - name: CI-only workaround (main also fails to type-check RecipeListView.body on Xcode 26.6)
        run: |
          python3 - <<'PY'
          p = 'Cookbook/Views/RecipeListView.swift'
          L = open(p).read().split('\n')
          assert L[413] == '    var body: some View {'
          assert L[431] == '        }' and L[499] == '        }' and L[500].strip() == '.fileImporter('
          L[413] = '    private var ciPart1: some View {'
          L[500:500] = ['    }', '    var body: some View {', '        ciPart2']
          L[432:432] = ['    }', '    private var ciPart2: some View {', '        ciPart1']
          open(p, 'w').write('\n'.join(L))
          PY
          git diff
      - name: Build iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build -project Cookbook.xcodeproj -scheme Cookbook \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ios.log
      - name: Build macOS
        if: always()
        run: |
          set -o pipefail
          xcodebuild build -project Cookbook.xcodeproj -scheme Cookbook \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee mac.log
      - name: Warnings in touched files
        if: always()
        run: |
          grep -h "warning:" ios.log mac.log | grep -E "ReviewPrompter|CookModeView|RecipeDetailView|ImportRecipeFromURLView|CookbookApp" | sort -u || echo "none"
